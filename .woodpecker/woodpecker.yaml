steps:
- name: reuse
  image: bash
  commands:
  - nix-shell --run 'reuse lint'

- name: commitlint
  image: bash
  commands:
  - nix-shell --run 'commitlint --from=initial'

- name: no-refs
  image: bash
  commands:
  - nix-build --no-out-link nix/no-refs.nix

- name: nix-web
  image: bash
  commands:
  - nix-build --no-out-link nix-web/tests.nix

- name: nix-supervisor
  image: bash
  commands:
  - nix-build --no-out-link nix-supervisor/tests.nix

when:
- event: [ push, pull_request, pull_request_closed, tag, release, manual, cron ]
