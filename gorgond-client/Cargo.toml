[package]
name = "gorgond-client"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
axum = { version = "0.8.1", optional = true, default-features = false }
axum-extra = { version = "0.10.0", features = ["erased-json"], optional = true }
derive_more = { version = "2.0.1", features = ["full"] }
miette = { version = "7.5.0", features = ["fancy", "syntect-highlighter", "serde"] }
reqwest = "0.12.12"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
strum = { version = "0.26.3", features = ["derive"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["net", "macros", "parking_lot"] }
tracing = "0.1.41"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.13.1", features = ["v7", "serde"] }

[features]
axum = ["dep:axum", "dep:axum-extra"]
