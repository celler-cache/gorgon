[package]
name = "gorgon-build-nix"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
gorgon-build-helper = { path = "../gorgon-build-helper" }
gorgond-client = { path = "../gorgond-client" }
gorgon-util-cli = { path = "../gorgon-util-cli" }
nix-daemon = { path = "../nix-daemon" }

log = { version = "0.4.26", features = ["kv", "kv_serde"] }
clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
miette = { version = "7.5.0", features = ["fancy", "syntect-highlighter"] }
nutmeg = "0.1.4"
owo-colors = "4.1.0"
serde_json = "1.0.138"
thiserror = "2.0.11"
url = "2.5.4"
derive_more = { version = "2.0.1", features = ["full"] }
clap-stdin = "0.6.0"
once_cell = { version = "1.21.3", features = ["parking_lot"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
strip-ansi-escapes = "0.2.1"
