[package]
name = "gorgon-build"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
derive_more = { version = "2.0.1", features = ["full"] }
futures = "0.3.31"
gorgond-client = { path = "../gorgond-client" }
miette = { version = "7.5.0", features = ["fancy", "syntect-highlighter"] }
owo-colors = "4.1.0"
reqwest = { version = "0.12.12", features = ["json"] }
strum = { version = "0.26.3", features = ["derive"] }
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.16.0"
terminal_size = "0.4.1"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "net", "fs", "process", "macros", "parking_lot"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["time", "smallvec", "once_cell", "parking_lot"] }
url = { version = "2.5.4", features = ["serde"] }
which = { version = "7.0.2", features = ["tracing"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
test-log = { version = "0.2.17", default-features = false, features = ["trace", "color"] }
