[package]
name = "gorgon-build"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
gorgond-client = { path = "../gorgond-client" }
gorgon-build-helper = { path = "../gorgon-build-helper" }
gorgon-util-cli = { path = "../gorgon-util-cli" }

async-nats = "0.40.0"
backon = "1.5.0"
bytes = "1.10.1"
clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
humantime = "2.2.0"
log = { version = "0.4.26", features = ["kv", "kv_serde"] }
miette = "7.5.0"
parking_lot = "0.12.3"
reqwest = "0.12.12"
serde_json = "1.0.140"
tempfile = "3.16.0"
thingbuf = "0.1.6"
thiserror = "2.0.11"
tokio-util = "0.7.15"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "net", "macros", "parking_lot"] }
