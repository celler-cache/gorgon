[package]
name = "gorgond-tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
gorgond-client = { path = "../gorgond-client" }
gorgond-diesel = { path = "../gorgond-diesel" }
gorgon-util-cli = { path = "../gorgon-util-cli" }
gorgon-util = { path = "../gorgon-util", features = ["source_url"] }
gorgon-build-helper = { path = "../gorgon-build-helper" }

backon.workspace = true
chrono.workspace = true
clap.workspace = true
colored_json.workspace = true
derive_more.workspace = true
diesel-async.workspace = true
diesel = { workspace = true, features = ["chrono", "uuid", "serde_json", "postgres_backend", "with-deprecated"] }
directories = "6.0.0"
futures.workspace = true
git2 = "0.20.2"
humantime.workspace = true
itertools = "0.14.0"
miette.workspace = true
rayon.workspace = true
scoped-futures.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10.9"
thiserror.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal"] }
tracing-appender = { version = "0.2.3", features = ["parking_lot"] }
tracing-indicatif.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
hex = "0.4.3"
serde_with = "3.15.1"
conflate = "0.3.3"
