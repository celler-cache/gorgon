<li class="derivation {% if ref_tmpls.len() > 0 %}branch{% else %}leaf{% endif %} {{ drv.status }}">
  <a href="{{ drv.path }}">{{ drv.path }}</a>
  {% if is_seen_before %} […]{% endif %}
  <a href="{{ drv.path }}?p=log" class="badge rounded-pill bg-secondary">log</a>

  {% if ref_tmpls.len() > 0 %}
  <details>
    <summary>Inputs</summary>
    <ul>
      {% for ref_tmpl in ref_tmpls %}
      {{ ref_tmpl|safe }}
      {% endfor %}
    </ul>
  </details>
  {% endif %}
</li>
