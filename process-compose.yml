version: "0.5"

processes:
  gorgond:
    description: Gorgon Daemon
    command: |
      eval "$(direnv export bash)"

      ./gorgond/bin/diesel database setup
      cargo run -p gorgond -- -v
    is_foreground: true
    depends_on:
      postgres: { condition: process_healthy }
      nats: { condition: process_healthy }
    readiness_probe:
      http_get:
        host: localhost
        port: 9999

  postgres:
    description: PostgreSQL Server
    command: |
      eval "$(direnv export bash)"

      echo "Postgres data to be stored in $$PGDATA"
      if [ ! -d $$PGDATA ]; then
        echo 'Initializing postgresql database...'
        initdb $$PGDATA
      fi

      postgres -D $$PGDATA -h '' -k $$PGHOST
    readiness_probe:
      exec:
        command: direnv exec . pg_isready -d postgres
  nats:
    description: NATS Server
    command: |
      direnv exec . nats-server --jetstream \
        --store_dir $$NATS_STORE_DIR -a $$NATS_SERVER_ADDR -p $$NATS_SERVER_PORT
    readiness_probe:
      exec:
        command: direnv exec . nats rtt
