[package]
name = "gorgon-fetch-git"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
gorgon-build-helper = { path = "../gorgon-build-helper" }
gorgon-util-cli = { path = "../gorgon-util-cli" }
miette = "7.5.0"
tracing = "0.1.41"
url = { version = "2.5.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
test-log = { version = "0.2.17", default-features = false, features = ["trace", "color"] }
