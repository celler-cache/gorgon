[package]
name = "gorgon-build-helper"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
gorgond-client = { path = "../gorgond-client" }

bounded-static = { version = "0.8.0", features = ["derive"] }
clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
miette = { version = "7.5.0", features = ["serde"] }
owo-colors = "4.1.0"
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
terminal_size = "0.4.1"
thiserror = "2.0.11"
tracing = "0.1.41"
which = { version = "7.0.2", features = ["tracing"] }
