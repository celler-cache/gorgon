[package]
name = "gorgon-util-cli"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
gorgon-build-helper = { path = "../gorgon-build-helper" }

clap = { version = "4.5.27", features = ["env", "cargo", "derive"] }
colored_json = "5.0.0"
miette = { version = "7.5.0", features = ["fancy", "serde", "syntect-highlighter"] }
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy"] }
strum = { version = "0.27.1", features = ["derive"] }
log = { version = "0.4.26", features = ["kv", "kv_serde"] }
fern = "0.7.1"
serde_json = "1.0.140"
owo-colors = { version = "4.2.0", features = ["supports-colors"] }
supports-color = "3.0.2"
textwrap = { version = "0.16.2", features = ["terminal_size"] }
