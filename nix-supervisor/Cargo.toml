[package]
name = "nix-supervisor"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
tokio = { version = "1.28", features = ["rt", "rt-multi-thread", "macros", "parking_lot", "time", "io-util", "net"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tap = "1.0.1"
anyhow = "1.0.72"
num_enum = "0.6.1"
tracing-journald = "0.3.0"
chrono = "0.4.29"
