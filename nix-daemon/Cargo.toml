[package]
name = "nix-daemon"
version = "0.1.1"
edition = "2021"
license = "EUPL-1.2"
authors = ["embr <git@liclac.eu>"]
description = "A library for talking directly to the Nix Daemon"
repository = "https://codeberg.org/gorgon/gorgon/src/branch/main/nix-daemon"
documentation = "https://docs.rs/nix-daemon/"
keywords = ["nix"]
categories = ["api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-stream = "0.3.6"
chrono = "0.4.44"
futures = "0.3.32"
num_enum = "0.7.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.18.0"
strum = { version = "0.28.0", features = ["derive"] }
tap = "1.0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = [
    "rt",
    "macros",
    "parking_lot",
    "io-util",
    "net",
] }
tokio-stream = "0.1.18"
tokio-test = "0.4.5"
tracing = "0.1.44"

[dev-dependencies]
rand = "0.10.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
